<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 두번째 인생</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  /* 메뉴바: 흰 바탕 */
  .menubar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; background: #fff; color: #000; }
  .menubar a { color: inherit; text-decoration: none; }
  .brand { font-size: 20px; font-weight: bold; }
  .menubar nav a { font-weight: bold; }
  .menubar a:hover { text-decoration: underline; }
  .menubar a:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
</style>
</head>
<body>
<!-- 메인 홈페이지 (/): 검은 바탕 + 흰 메뉴바. 게임은 /play -->
<header class="menubar">
  <a class="brand" href="/">나의 두번째 인생</a>
  <nav aria-label="메뉴"><a href="/play">입장하기</a></nav>
</header>
</body>
</html>
