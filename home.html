<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 두번째 인생</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/wordmark.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 큰 제목 글꼴: Black Han Sans, 제목 다섯 글자만 받아 옴 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&text=%EB%82%98%EC%9D%98%EB%91%90%EB%B2%88%EC%A7%B8%EC%9D%B8%EC%83%9D&display=swap">
<style>
  /* ===== 흑백 일러스트 느낌: 밝은 회색 바탕 + 검은 덩어리 + 입체 제목 + 선 그림 ===== */
  html, body { background: #e4e4e2; color: #000; }
  .menubar { background: transparent; }   /* 흰 띠 없이 첫 화면(영역 1)과 한 덩어리 */
  .menubar nav a { font-size: 13px; letter-spacing: .12em; }
  /* 영역은 한 화면 단위: 첫 화면 = 메뉴바(88px) + 히어로, 그다음부터는 한 영역 = 화면 높이. 스크롤하다 가까우면 영역 시작에 살짝 맞춰 멈춤 */
  :root { --bar: 88px; }
  /* 영역 사이 이동은 부드럽게(화살표·링크). 마우스 휠은 스크립트가 한 번에 한 영역씩 넘김. 터치 스크롤은 영역 가까이서 살짝 맞춰 멈춤(proximity). 움직임 줄이기 설정이면 바로 이동 */
  html { scroll-snap-type: y proximity; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  .panel { min-height: 100svh; display: grid; place-items: center; padding: 32px 0; box-sizing: border-box; scroll-snap-align: start; }

  /* ----- 히어로 ----- */
  .hero { position: relative; overflow: hidden; height: calc(100svh - var(--bar)); min-height: 560px; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; scroll-snap-align: end; }
  .hero-text { position: relative; z-index: 2; text-align: center; max-width: 100%; }
  /* 입체 제목: 흰 글자 + 검은 테두리 + 오른쪽 아래로 겹겹이 밀린 검은 그림자(두께감) */
  .extrude {
    margin: 0; font-family: "Black Han Sans", "Malgun Gothic", sans-serif; font-weight: 400;
    font-size: clamp(54px, 9.6vw, 150px); line-height: 1.02; letter-spacing: .01em; color: #fff;
    -webkit-text-stroke: .035em #000; paint-order: stroke fill;
    text-shadow: .012em .012em 0 #000, .024em .024em 0 #000, .036em .036em 0 #000, .048em .048em 0 #000,
                 .06em .06em 0 #000, .072em .072em 0 #000, .084em .084em 0 #000, .096em .096em 0 #000;
  }
  .extrude span { display: block; }
  /* 아래 영역으로 내려가는 화살표: 첫 화면 맨 아래 가운데, 검은 동그라미 + 흰 화살표. 천천히 위아래로 까딱임 */
  .next {
    position: absolute; z-index: 3; left: 50%; bottom: 22px; width: 52px; height: 52px; margin-left: -26px;
    display: grid; place-items: center; border-radius: 50%; background: #000; color: #fff; box-shadow: 4px 4px 0 #9a9a9a;
  }
  .next:hover { background: #2a2a2a; }
  .next:focus-visible { outline: 3px solid #000; outline-offset: 4px; }
  @media (prefers-reduced-motion: no-preference) {
    .next { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateY(7px); } }
  }
  .tag { margin: 26px auto 0; max-width: 34em; font-size: clamp(13px, 1.1vw, 15px); letter-spacing: .12em; line-height: 1.8; }
  .live { margin: 22px 0 0; font-size: 13px; font-weight: bold; letter-spacing: .06em; }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #000; vertical-align: 1px; }

  /* 검은 덩어리(별 점 포함)와 선 그림: 화면 폭(vw)에 맞춰 같이 커지고 작아짐 */
  .deco { position: absolute; z-index: 1; display: block; pointer-events: none; }
  .blob path { fill: #000; }
  .blob circle, .blob .spark { fill: #fff; }
  .b1 { width: clamp(220px, 27vw, 420px); top: 5%; right: 5%; transform: rotate(8deg); }
  .b2 { width: clamp(110px, 13vw, 200px); top: 30%; left: -3%; transform: rotate(-20deg); }
  .b3 { width: clamp(260px, 32vw, 500px); bottom: -14%; left: -8%; transform: rotate(150deg); }
  .b4 { width: clamp(260px, 34vw, 540px); bottom: -22%; right: -9%; transform: rotate(40deg); }
  .line { fill: #fff; stroke: #000; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .study { width: clamp(150px, 17vw, 260px); top: 13%; right: 9%; }   /* 검은 덩어리 안: 검은 바탕 + 흰 선 */
  .study .line { fill: #000; stroke: #fff; }
  .coins { width: clamp(90px, 10vw, 150px); bottom: 15%; left: 12%; }
  .work { width: clamp(84px, 9vw, 140px); top: 16%; left: 9%; }
  .hobby { width: clamp(84px, 9vw, 140px); top: 44%; right: 7%; transform: rotate(-10deg); }
  .person { width: clamp(56px, 6vw, 92px); height: auto; bottom: 14%; right: 17%; filter: grayscale(1) contrast(1.15); transform: rotate(-14deg); }
  @media (prefers-reduced-motion: no-preference) {
    .person { animation: float 6s ease-in-out infinite; }   /* 떠다니는 캐릭터 하나만 천천히 움직임 */
    @keyframes float { 50% { transform: rotate(-8deg) translateY(-14px); } }
  }
  @media (max-width: 640px) { .work, .coins, .hobby { display: none; } .study { top: 6%; } .person { width: 48px; bottom: 3%; right: 7%; } }   /* 휴대폰: 글자를 가리지 않게 */

  /* ===== 게임 입장 화면 =====
     지금 마을 바깥 풍경을 게임 그림 그대로 실시간으로 그림.
     크기: 한 화면 영역(.panel) 가운데 둥근 상자, 최대 폭 880px·그림 비율(320:176) 그대로 → 1366px 화면에서 880×484.
     좁은 화면은 비율대로면 로그인 칸이 안 들어가서 최소 높이 480px(이때만 그림 양옆이 잘림).
     그림은 칸을 꽉 채우고 넘치는 부분만 잘림(object-fit: cover) → 어떤 해상도에서도 빈 곳·찌그러짐 없음 */
  .stage {
    position: relative; width: min(880px, calc(100% - 32px), calc((100svh - 64px) * 320 / 176)); aspect-ratio: 320 / 176; min-height: 480px;
    margin: 0 auto; border-radius: 18px;   /* 폭은 화면 높이에도 맞춰 줄어 한 화면 안에 들어옴 */ border: 3px solid #000; overflow: hidden; background: #6fb35f;
  }
  .stage canvas { display: block; width: 100%; height: 100%; object-fit: cover; transition: filter .8s; }
  .stage.mono canvas { filter: grayscale(1) contrast(1.05); }   /* 로그인 전엔 흑백 → 로그인하면 컬러 (두 번째 인생 시작) */
  /* 전광판 글자: 그림의 전광판 화면 칸 위에 띄움. 위치·크기는 그림 배율(--k: 그림 1칸 = k px)에 맞춰 스크립트가 정함 */
  .bb { position: absolute; padding: calc(var(--k) * 1px) calc(var(--k) * 2px); color: #ffb347; font: calc(var(--k) * 4.2px)/1.4 Consolas, monospace; overflow: hidden; pointer-events: none; }
  .bb ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(5, auto); column-gap: calc(var(--k) * 3px); }
  .bb li { display: grid; grid-template-columns: calc(var(--k) * 5px) 1fr auto; gap: calc(var(--k) * 1.2px); white-space: nowrap; text-shadow: 0 0 calc(var(--k) * 1px) #ff8a00; }
  .bb .nm { overflow: hidden; text-overflow: ellipsis; }
  .bb .rk { color: #ff6b6b; }

  /* 가운데 칸 (로그인 / 게임 시작) */
  .center { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; }   /* 칸 너비 = 화면 너비 - 여백 → 카드가 좁은 화면을 넘지 않음 */
  .center[hidden] { display: none; }
  .card {
    width: min(360px, 100%); box-sizing: border-box; background: #fff; color: #000; border-radius: 18px; padding: 28px 28px 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .25); text-align: center;
  }
  .card .logo3d.big { margin: 0 auto 12px; font-size: 32px; }   /* 카드 맨 위 입체 글자 로고 */
  .card h1 { margin: 10px 0 4px; font-size: 22px; }
  .card p { margin: 0 0 18px; color: #555; font-size: 14px; line-height: 1.5; }

  /* 로그아웃 상태: 마을 위에 흰 블러 */
  .veil { background: rgba(255, 255, 255, .45); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  form { display: grid; gap: 10px; text-align: left; }
  label { font-size: 13px; font-weight: bold; }
  input {
    display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 11px 12px; font: inherit; font-size: 16px;
    border: 2px solid #d5d5d5; border-radius: 10px; background: #fff; color: #000;
  }
  input:focus { outline: none; border-color: #000; }
  .btn {
    display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 12px; font: inherit; font-size: 16px; font-weight: bold;
    color: #fff; background: #000; border: 0; border-radius: 10px; cursor: pointer; text-align: center; text-decoration: none;
  }
  .btn:hover { background: #2a2a2a; }
  .btn:focus-visible { outline: 3px solid #e8454b; outline-offset: 2px; }
  .msg { min-height: 1.4em; margin: 2px 0 0; font-size: 13px; color: #c62828; }
  .hint { margin: 12px 0 0 !important; font-size: 12px !important; color: #777 !important; }

  @media (prefers-reduced-motion: reduce) { .veil { transition: none; } }
</style>
</head>
<body>

<header class="menubar">

  <svg class="deco blob b1" viewBox="0 0 200 200" aria-hidden="true"><path d="M128 12c26 6 40 30 52 52 12 22 22 46 12 70-10 25-38 34-62 46-24 12-52 20-76 6C30 172 14 144 10 116 6 88 12 58 30 38 50 16 100 6 128 12z"/><circle cx="40" cy="70" r="1.6"/><circle cx="150" cy="150" r="1.2"/><circle cx="60" cy="150" r="1"/><path class="spark" d="M165 55l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/></svg>

      <path d="M20 83v-9M100 83v-9"/><ellipse cx="60" cy="74" rx="40" ry="11"/><path d="M20 74v-9M100 74v-9"/><ellipse cx="60" cy="65" rx="40" ry="11"/>
      <circle cx="78" cy="30" r="22"/><circle cx="78" cy="30" r="15"/>

<section class="panel" id="play" aria-label="게임 입장">
<div class="stage mono" id="stage">
  <canvas id="town" width="1280" height="704" aria-hidden="true"></canvas>
  <div class="bb" id="bb" aria-hidden="true"><ol id="bbList"></ol></div>

  <!-- 로그아웃 상태: 흰 블러 + 로그인 -->
  <div class="center veil" id="veil" hidden>
    <div class="card" id="login">
      <p class="logo3d big" aria-hidden="true">나의 두번째 인생</p>
      <h1>로그인</h1>
      <p>처음 쓰는 닉네임이면 계정이 바로 만들어져요.</p>
      <form id="loginForm" autocomplete="on">
        <label>닉네임<input id="name" name="username" autocomplete="username" maxlength="10" required></label>
        <label>비밀번호<input id="pw" name="password" type="password" autocomplete="current-password" minlength="4" maxlength="30" required></label>

    <div class="card">
      <p class="logo3d big" aria-hidden="true">나의 두번째 인생</p>
      <h1 id="hello">다시 오셨네요</h1>
      <p>마을 사람들이 기다리고 있어요.</p>
      <a class="btn" href="/play">게임 시작</a>

<script>
'use strict';
const $ = id => document.getElementById(id);

// 첫 화면 = 메뉴바 + 히어로가 딱 한 화면이 되도록, 메뉴바의 실제 높이(휴대폰은 두 줄이라 더 높음)를 --bar에 넣음
new ResizeObserver(([e]) => document.documentElement.style.setProperty('--bar', `${e.target.offsetHeight}px`)).observe(document.querySelector('.menubar'));

// ===== 마우스 휠: 한 번 굴리면 굴린 쪽의 다음(이전) 영역 시작으로 부드럽게 넘어감 =====
// (브라우저 자체 맞춤은 '가까운 영역'으로 가서, 조금만 굴리면 첫 화면으로 되돌아가 버림)
const smooth = matchMedia('(prefers-reduced-motion: no-preference)').matches ? 'smooth' : 'auto';
let paging = false;
addEventListener('wheel', e => {
  if (e.ctrlKey || Math.abs(e.deltaY) < 4) return;                  // 확대(Ctrl+휠)·아주 작은 움직임은 그대로
  if (paging) return e.preventDefault();                             // 넘어가는 중에 들어온 휠은 무시
  const tops = [0, $('play').offsetTop], y = scrollY;
  const to = e.deltaY > 0 ? tops.find(t => t > y + 2) : [...tops].reverse().find(t => t < y - 2);
  if (to === undefined) return;                                      // 더 갈 영역이 없으면 보통 스크롤
  e.preventDefault();
  paging = true;
  scrollTo({ top: to, behavior: smooth });
  setTimeout(() => { paging = false; }, 900);
}, { passive: false });

// ===== 로그인 상태에 따라 가운데 칸 바꾸기 (메뉴바의 site.js가 'auth' 이벤트로 알려 줌) =====
document.addEventListener('auth', e => {
  const me = e.detail;
  $('veil').hidden = !!me;
  $('gate').hidden = !me;
  $('stage').classList.toggle('mono', !me);
  if (me) $('hello').textContent = `${me.name}님, 다시 오셨네요`;
});
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('msg').textContent = '';
  try {
    const d = await (await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value, password: $('pw').value }) })).json();
    $('pw').value = '';
    if (!d.ok) { $('msg').textContent = d.msg; return; }
    const me = await (await fetch('/api/me', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })).json();
    window.setAuth(me.ok ? me.me : null);
  } catch {
    $('msg').textContent = '서버에 연결할 수 없어요. 잠시 뒤 다시 시도하세요.';
  }
});

// ===== 실시간 마을 풍경 =====
let ST = null;
const people = new Map();   // 밖에 있는 사람: 받은 위치(tx,ty)까지 걷듯 따라감
async function poll() {
  try { ST = await (await fetch('/api/poll?peek')).json(); } catch { return; }   // peek: 이 페이지는 접속자로 세지 않음
  $('people').textContent = `지금 ${ST.players.length}명이 이 마을에 살고 있어요`;
  const out = ST.players.filter(p => p.scene === 'outside');
  for (const p of out) {
    const o = people.get(p.id);
    if (!o || Math.hypot(o.x - p.pos.x, o.y - p.pos.y) > 80) people.set(p.id, { x: p.pos.x, y: p.pos.y, tx: p.pos.x, ty: p.pos.y, p });
    else Object.assign(o, { tx: p.pos.x, ty: p.pos.y, p });
  }
  for (const id of people.keys()) if (!out.some(p => p.id === id)) people.delete(id);
  // 전광판: 모든 계정의 자산 순위 TOP 10
  $('bbList').replaceChildren(...ST.top10.map((p, k) => {
    const li = document.createElement('li');
    for (const [c, t] of [['rk', k + 1], ['nm', p.name], ['am', `${Math.round(p.total / 10000).toLocaleString('ko-KR')}만`]]) { const sp = document.createElement('span'); sp.className = c; sp.textContent = t; li.append(sp); }
    return li;
  }));
}
// 전광판 글자 칸을 그림 위 화면 칸(BILLBOARD.screen)에 맞춤. 그림은 칸을 덮도록(cover) 커지고 가운데 정렬되므로 같은 계산을 함
function placeBillboard() {
  const W = cv.clientWidth, H = cv.clientHeight, k = Math.max(W / 320, H / 176), ox = (W - 320 * k) / 2, oy = (H - 176 * k) / 2, sc = BILLBOARD.screen;
  const bb = $('bb');
  Object.assign(bb.style, { left: `${ox + sc.x * k}px`, top: `${oy + sc.y * k}px`, width: `${sc.w * k}px`, height: `${sc.h * k}px` });
  bb.style.setProperty('--k', k);
}
const cv = $('town'), ctx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // 캔버스 해상도: 칸을 덮는 크기(가로·세로 중 큰 쪽 기준) × 화면 배율, 최대 2560px
  const cover = Math.max(cv.clientWidth, cv.clientHeight * 320 / 176);
  const w = Math.min(2560, Math.round(cover * (devicePixelRatio || 1)));
  if (w && cv.width !== w) { cv.width = w; cv.height = Math.round(w * 176 / 320); }
  placeBillboard();
  if (ST) {
    const ants = [...people.values()].map(o => {
      const dx = o.tx - o.x, dy = o.ty - o.y, d = Math.hypot(dx, dy);
      if (d) { const step = Math.min(d, Math.max(60, d * 4) * dt); o.x += dx / d * step; o.y += dy / d * step; }
      const r = o.p.total / (o.p.base || 1000000) - 1;
      return { id: o.p.id, x: o.x, y: o.y, color: o.p.color, mood: r > 0.01 ? 'happy' : r < -0.01 ? 'sad' : 'normal', bob: !still && d > 0.5 && Math.floor(now / 150) % 2 === 0 };
    });
    drawRoomHD(ctx, { scene: 'outside', clock: ST.clock, coins: ST.coins, weather: ST.weather, anim: still ? 0 : Math.floor(now / 120), ants, blink: !still && Math.floor(now / 400) % 2 === 0 });
  }
  requestAnimationFrame(frame);
}
poll(); setInterval(poll, 1000);
requestAnimationFrame(frame);
</script>
