<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 두번째 인생 — 도시</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<style>
  /* 게임 화면: 메뉴바 없이 화면 전체가 게임 캔버스(사각형 칸 픽셀 도시) */
  html, body { height: 100%; overflow: hidden; background: #1d2a1b; color: #000; }
  body { display: grid; grid-template-rows: 1fr; }
  /* 간판 글씨용 픽셀 폰트(갈무리11, 무료 OFL). town.js가 건물 간판을 그릴 때 씀 */
  @font-face { font-family: Galmuri11; font-display: swap; src: url(https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2) format("woff2"); }
  #game { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .view { position: relative; min-height: 0; }
  /* 조작 안내 창: 화면 가운데, 말풍선과 같은 픽셀 모양(흰 바탕 + 검은 계단 테두리 + 오른쪽·아래 회색 그늘) */
  @font-face { font-family: Galmuri14; font-display: swap; src: url(https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri14.woff2) format("woff2"); }
  .guide-wrap { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20, 18, 30, .35); padding: 16px; }
  .guide-wrap[hidden] { display: none; }
  .guide {
    width: min(420px, 100%); box-sizing: border-box; padding: 22px 26px 20px; background: #fff; color: #000;
    font: 14px/1.6 Galmuri14, "Malgun Gothic", monospace; -webkit-font-smoothing: none;
    box-shadow: 4px 0 #000, -4px 0 #000, 0 4px #000, 0 -4px #000, inset -4px -4px #b8b8b8;   /* 네 모서리가 한 칸씩 깎인 픽셀 테두리 + 안쪽 그늘 */
  }
  .guide h2 { margin: 0 0 14px; font: inherit; font-size: 14px; text-align: center; }
  .guide ul { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
  .guide li { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 12px; }
  .guide .keys { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
  .guide .soon { color: #777; }
  /* 자판 모양 키 */
  kbd { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; box-sizing: border-box; background: #f1f0ec; color: #000; font: inherit; font-size: 12px; box-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, inset -2px -2px #c8c6c0; margin: 2px; }
  .guide button {
    display: block; margin: 0 auto; padding: 6px 26px; border: 0; background: #2f6fc6; color: #fff; font: inherit; cursor: pointer;
    box-shadow: 3px 0 #000, -3px 0 #000, 0 3px #000, 0 -3px #000, inset -3px -3px #1f4f96;
  }
  .guide button:hover { background: #3d7fd6; }
  .guide button:focus-visible { outline: 3px dashed #f2c94c; outline-offset: 6px; }
  .guide .touch { display: none; }
  /* 메뉴 창(ESC): 같은 픽셀 창 안에 큰 버튼을 세로로. 맨 위 "게임으로 돌아가기"는 파랑, 로그아웃은 빨강 */
  .menu { width: min(300px, 100%); }
  /* 메뉴 제목 "나의 두번째 인생": 같은 픽셀 폰트의 굵은 글꼴을 2배(22px)로 → 픽셀이 딱 맞고 두껍게 보임 */
  @font-face { font-family: Galmuri11; font-weight: 700; font-display: swap; src: url(https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2) format("woff2"); }
  .guide.menu h2 { margin: 2px 0 18px; font: 700 22px/1.3 Galmuri11, "Malgun Gothic", monospace; letter-spacing: 1px; }
  .menu-list { display: grid; gap: 14px; }
  .menu-list[hidden] { display: none; }
  .guide .menu-list button { width: 100%; margin: 0; padding: 9px 12px; background: #fff; color: #000; box-shadow: 3px 0 #000, -3px 0 #000, 0 3px #000, 0 -3px #000, inset -3px -3px #c8c6c0; }
  .guide .menu-list button:hover { background: #f1f0ec; }
  .guide .menu-list .primary { background: #2f6fc6; color: #fff; box-shadow: 3px 0 #000, -3px 0 #000, 0 3px #000, 0 -3px #000, inset -3px -3px #1f4f96; }
  .guide .menu-list .primary:hover { background: #3d7fd6; }
  .guide .menu-list .danger { background: #d8443f; color: #fff; box-shadow: 3px 0 #000, -3px 0 #000, 0 3px #000, 0 -3px #000, inset -3px -3px #a8302c; }
  .guide .menu-list .danger:hover { background: #e8574f; }
  .menu-list p { margin: 0; font-size: 12px; text-align: center; }
  /* 메뉴 버튼 (작은 "☰"): 휴대폰·태블릿에만. ESC 키가 없으니 이것으로 메뉴를 엶 (PC는 ESC) */
  .menu-btn { display: none; }
  .menu-btn {
    position: absolute; right: 18px; bottom: 18px; width: 36px; height: 36px; border: 0; background: #fff; color: #000; cursor: pointer;
    font: 16px Galmuri14, monospace; box-shadow: 3px 0 #000, -3px 0 #000, 0 3px #000, 0 -3px #000, inset -3px -3px #b8b8b8;
  }
  .menu-btn:focus-visible { outline: 3px dashed #f2c94c; outline-offset: 5px; }

  /* 휴대폰·태블릿(손가락): 왼쪽 아래 조이스틱, 오른쪽 아래 E 버튼. 마우스 기기에서는 숨김 */
  .stick, .ebtn { display: none; }
  @media (pointer: coarse) {
    .guide .keyboard { display: none; } .guide .touch { display: grid; }   /* 안내 창: 키보드 대신 조이스틱·E 버튼 설명 */
    .menu-btn { display: block; right: 28px; bottom: auto; top: 18px; }
    .stick { display: block; position: absolute; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(0, 0, 0, .12); border: 3px solid #000; touch-action: none; }
    .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: #000; }
    .ebtn { display: grid; place-items: center; position: absolute; right: 28px; bottom: 40px; width: 76px; height: 76px; border-radius: 50%; border: 3px solid #000; background: #fff; font: bold 28px sans-serif; color: #000; touch-action: none; }
  }
</style>
</head>
<body>
<main class="view">
  <canvas id="game" tabindex="0" aria-label="도시 화면. 방향키나 WASD로 움직이고 E로 상호작용"></canvas>
  <div class="stick" id="stick" aria-hidden="true"><div class="knob" id="knob"></div></div>
  <button class="ebtn" id="ebtn" type="button" aria-label="상호작용">E</button>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기">☰</button>
  <!-- 메뉴 창: ESC(또는 ☰)로 열고 닫음. 이용방법으로 조작 방법을 다시 볼 수 있음 -->
  <div class="guide-wrap" id="menuWrap" hidden>
    <section class="guide menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <h2 id="menuTitle">나의 두번째 인생</h2>
      <div class="menu-list" id="menuMain">
        <button type="button" class="primary" data-act="resume">게임으로 돌아가기</button>
        <button type="button" data-act="guide">이용방법</button>
        <button type="button" data-act="settings">설정</button>
        <button type="button" data-act="home">홈페이지로 이동</button>
        <button type="button" class="danger" data-act="logout">로그아웃</button>
      </div>
      <div class="menu-list" id="menuSettings" hidden>
        <p class="soon">소리·화면 설정은 준비 중이에요.</p>
        <button type="button" class="primary" data-act="back">뒤로</button>
      </div>
    </section>
  </div>
  <!-- 조작 안내 창: 처음 한 번만 저절로 뜨고, 확인(또는 Enter·E·Esc·Space)으로 닫음. 메뉴 → 이용방법으로 다시 열기 -->
  <div class="guide-wrap" id="guideWrap" hidden>
    <section class="guide" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
      <h2 id="guideTitle">조작 방법</h2>
      <ul class="keyboard">
        <li><span class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>움직이기</span></li>
        <li><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>움직이기</span></li>
        <li><span class="keys"><kbd>E</kbd></span><span>말 걸기·사용하기</span></li>
        <li class="soon"><span class="keys"><kbd>0</kbd>~<kbd>9</kbd></span><span>모자 바꿔 보기 (임시)</span></li>
        <li class="soon"><span class="keys"><kbd>Q</kbd></span><span>전신 스킨 바꿔 보기 (임시)</span></li>
      </ul>
      <ul class="touch">
        <li><span class="keys">왼쪽 아래 조이스틱</span><span>움직이기 (많이 밀수록 빨리)</span></li>
        <li><span class="keys"><kbd>E</kbd> 버튼</span><span>말 걸기·사용하기</span></li>
        <li><span class="keys">화면 누르기</span><span>가로 전체화면</span></li>
      </ul>
      <button type="button" id="guideOk">확인</button>
    </section>
  </div>
</main>
<script src="/site.js"></script>
<script src="/sprites.js"></script>
<script src="/town.js"></script>
<script src="/game.js"></script>
<script>
'use strict';
// 창 두 개(키보드는 게임보다 먼저 가로채서, 창이 열려 있는 동안 캐릭터가 움직이지 않게 함)
//   조작 안내 창: 계정을 만들고 처음 들어왔을 때 한 번만 저절로 뜸(서버 계정에 "봤음" 기록). Enter·E·Esc·Space로 닫음
//   메뉴 창: ESC나 ☰로 열고 닫음. ↑↓(W/S)로 고르고 Enter·Space·E로 누름
{
  const $ = id => document.getElementById(id), game = $('game');
  const guide = $('guideWrap'), ok = $('guideOk'), menu = $('menuWrap'), main = $('menuMain'), settings = $('menuSettings');
  const post = name => fetch('/api/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  // 조작 안내 창
  let first = false;      // 이번이 처음 자동으로 뜬 것인지
  let fromMenu = false;   // 메뉴의 "이용방법"으로 열었는지 → 닫으면 메뉴로 돌아감(뒤로 가기처럼)
  const openGuide = () => { guide.hidden = false; ok.focus(); };
  const closeGuide = () => {
    guide.hidden = true;
    if (first) { first = false; post('guideSeen').catch(() => {}); }
    if (fromMenu) { fromMenu = false; openMenu(); $('menuMain').querySelector('[data-act=guide]').focus(); }
    else game.focus();
  };
  const onMe = me => { if (me && !me.guideSeen && guide.hidden && !first) { first = true; openGuide(); } };
  document.addEventListener('auth', e => onMe(e.detail));
  if (window.authState) onMe(window.authState.me);
  ok.addEventListener('click', closeGuide);
  // 메뉴 창
  const page = list => {
    main.hidden = list !== main; settings.hidden = list !== settings;
    $('menuTitle').textContent = list === main ? '나의 두번째 인생' : '설정';
    list.querySelector('button').focus();
  };
  const openMenu = () => { menu.hidden = false; page(main); };
  const closeMenu = () => { menu.hidden = true; game.focus(); };
  const ACTS = {
    resume: closeMenu,
    settings: () => page(settings),
    back: () => page(main),
    guide: () => { menu.hidden = true; fromMenu = true; openGuide(); },
    home: () => location.assign('/'),
    logout: async () => { await post('logout').catch(() => {}); location.assign('/'); },
  };
  menu.addEventListener('click', e => { const act = e.target.closest('button')?.dataset.act; if (act) ACTS[act](); });
  $('menuBtn').addEventListener('click', () => (menu.hidden ? openMenu() : closeMenu()));
  addEventListener('keydown', e => {
    if (!guide.hidden) {
      if (['Enter', 'Escape', ' ', 'e', 'E'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); closeGuide(); }
      return;
    }
    if (menu.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); openMenu(); }
      return;
    }
    // 메뉴가 열려 있음: 메뉴 조작만 하고 게임에는 키를 넘기지 않음
    e.stopPropagation();
    const btns = [...(main.hidden ? settings : main).querySelectorAll('button')], i = btns.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); if (main.hidden) page(main); else closeMenu(); }   // 설정에서 ESC → 메뉴로, 메뉴에서 ESC → 게임으로
    else if (['ArrowDown', 's', 'S'].includes(e.key)) { e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
    else if (['ArrowUp', 'w', 'W'].includes(e.key)) { e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
    else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); document.activeElement?.click(); }   // Enter·Space는 버튼이 스스로 눌림
  }, true);
}
</script>
</body>
</html>
