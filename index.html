<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개미 투자 교실 — 주식 시뮬레이션</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><img id="logo" class="px" width="32" height="32" alt=""> 개미 투자 교실</h1>
  <div class="settings">
    <label>난이도(변동성)
      <select id="diff">
        <option value="low">낮음</option>
        <option value="mid">보통</option>
        <option value="high">높음</option>
      </select>
    </label>
    <label><input type="checkbox" id="mute"> 소리 끄기</label>
    <label><input type="checkbox" id="reduce"> 움직임 줄이기</label>
  </div>
</header>
<p id="notice" class="notice" hidden></p>

<main class="layout">
  <section class="stage">
    <div class="panel hud" aria-label="현재 상태">
      <span id="badge" class="badge"></span>
      <dl class="stats">
        <div><dt>거래일</dt><dd id="day"></dd></div>
        <div><dt>현금</dt><dd id="cash"></dd></div>
        <div><dt>주식 평가액</dt><dd id="stockValue"></dd></div>
        <div><dt>총자산</dt><dd id="total"></dd></div>
        <div><dt>수익률</dt><dd id="ret"></dd></div>
        <div><dt>배운 개념</dt><dd id="learned"></dd></div>
      </dl>
      <div class="goal">
        <span>실패 85만(-15%)</span>
        <progress id="progress" max="100" value="50"></progress>
        <span>성공 115만(+15%)</span>
      </div>
    </div>

    <div id="roomWrap" class="room-wrap">
      <canvas id="room" class="px room" width="320" height="176" role="img"
        aria-label="개미 투자자의 사무실. 방향키로 개미를 움직이고 물건 앞에서 Space를 누릅니다."></canvas>
      <p id="ticker" class="ticker" hidden></p>
      <p id="prompt" class="prompt"></p>
      <p id="msg" class="msg" aria-live="polite"></p>
    </div>

    <div class="panel">
      <div class="controls">
        <button id="startBtn" class="primary">시작 <kbd>Enter</kbd></button>
        <button id="buyBtn" class="buy">1주 매수 <kbd>B</kbd></button>
        <button id="sellBtn" class="sell">1주 매도 <kbd>S</kbd></button>
        <button id="pauseBtn">일시정지 <kbd>P</kbd></button>
        <button id="restartBtn">다시 시작 <kbd>R</kbd></button>
        <div id="stocks" class="stocks" aria-label="종목 (1·2·3)"></div>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody" class="modal-body"></div>
    <button id="modalClose" class="primary">닫기 <kbd>Esc</kbd></button>
  </div>
</div>

<div id="pc" class="pc" hidden>
  <div class="pc-monitor" role="dialog" aria-modal="true" aria-label="컴퓨터: 개미증권 HTS">
    <div class="pc-screen">
      <div class="pc-titlebar">
        <span>📈 개미증권 HTS</span>
        <span id="pcClock"></span>
        <button id="pcClose" class="pc-x">로그아웃 <kbd>Esc</kbd></button>
      </div>
      <div class="pc-body">
        <section class="pc-box pc-watch-box" aria-label="관심 종목과 계좌">
          <h3>관심 종목 <small>↑↓</small></h3>
          <div id="pcWatch" class="pc-watch"></div>
          <h3>내 계좌</h3>
          <dl id="pcAccount" class="pc-dl"></dl>
        </section>
        <section class="pc-box pc-main" aria-label="현재가와 차트">
          <div id="pcQuote" class="pc-quote"></div>
          <canvas id="pcChart" class="px pc-chart" width="300" height="90" role="img" aria-label="선택한 종목의 일봉 차트"></canvas>
          <p class="pc-legend">일봉: 빨강 상승 · 파랑 하락 · 주황 점선 = 내 평단</p>
          <div class="pc-tabs" role="tablist">
            <button data-tab="hold" role="tab">잔고</button>
            <button data-tab="log" role="tab">체결 내역</button>
            <button data-tab="info" role="tab">기업 정보</button>
          </div>
          <div id="pcTab" class="pc-tab"></div>
        </section>
        <section class="pc-box" aria-label="호가">
          <h3>호가 <small>잔량</small></h3>
          <table id="pcBook" class="pc-book"></table>
        </section>
        <section class="pc-box pc-order" aria-label="주문">
          <h3>주문</h3>
          <p id="pcOrderName" class="pc-order-name"></p>
          <label class="pc-qty">수량 <input id="pcQty" type="number" min="1" step="1" value="1" inputmode="numeric"> 주</label>
          <div class="pc-quick">
            <button data-q="1">1주</button><button data-q="10">10주</button>
            <button data-q="max">최대 매수</button><button data-q="all">전량</button>
          </div>
          <dl id="pcOrderInfo" class="pc-dl"></dl>
          <div class="pc-order-btns">
            <button id="pcBuy" class="pc-buy">매수</button>
            <button id="pcSell" class="pc-sell">매도</button>
          </div>
          <p id="pcMsg" class="pc-msg" aria-live="polite"></p>
        </section>
      </div>
      <div id="pcStatus" class="pc-statusbar"></div>
    </div>
  </div>
</div>

<template id="tpl-rules">
  <ul class="rules">
    <li>시작 자금 <b>100만 원</b>. 1거래일은 1.2초씩 흐르고 최대 <b>60거래일</b>입니다.</li>
    <li><b>성공</b>: 총자산 115만 원(+15%) 이상</li>
    <li><b>실패</b>: 총자산 85만 원(-15%) 이하, 또는 60일이 지나도 목표 미달</li>
    <li>컴퓨터 책상 앞에서 버튼 한 번(또는 키 한 번)에 <b>1주</b>씩 사고팝니다.</li>
    <li>뉴스가 오면 TV에 <b>!</b>가 뜹니다. TV 앞에서 Space를 눌러 📘 배우기를 읽으면 배운 개념이 늘어납니다.</li>
    <li>책장·칠판·캐비닛·TV를 보는 동안에는 시간이 멈춥니다. 창을 벗어나도 자동으로 일시정지됩니다.</li>
  </ul>
</template>

<template id="tpl-glossary">
  <dl class="glossary">
    <dt>주식</dt><dd>회사의 소유권을 잘게 나눈 조각. 주식을 사면 그 회사의 작은 주인이 됩니다.</dd>
    <dt>매수 / 매도</dt><dd>주식을 사는 것 / 파는 것.</dd>
    <dt>평균단가(평단)</dt><dd>여러 번 산 주식의 1주당 평균 구매 가격. 현재가가 평단보다 높으면 이익입니다.</dd>
    <dt>평가손익</dt><dd>지금 팔면 얻을 이익·손실. 팔기 전까지는 확정되지 않습니다.</dd>
    <dt>수익률</dt><dd>(현재 자산 ÷ 시작 자산 − 1) × 100%.</dd>
    <dt>변동성</dt><dd>주가가 오르내리는 폭. 클수록 큰 이익도, 큰 손실도 가능합니다.</dd>
    <dt>분산투자</dt><dd>여러 종목에 나눠 투자해 한 회사의 악재에 따른 손실을 줄이는 방법.</dd>
    <dt>경기방어주</dt><dd>불황에도 수요가 꾸준한 식품·생활필수품 기업의 주식.</dd>
    <dt>손절매</dt><dd>더 큰 손실을 막기 위해 손해를 보고 파는 것.</dd>
  </dl>
</template>

<template id="tpl-records-skeleton">
  <p class="small">최고 수익률 <b class="best"></b> · 배운 개념 <b class="learned-count"></b> · 최근 20판까지 표시</p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>난이도</th><th>판 수</th><th>성공</th><th>수익률 범위</th><th>중앙값</th><th>가장 잦은 실패 원인</th></tr></thead>
      <tbody class="summary"></tbody>
    </table>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>난이도</th><th>결과</th><th>거래일</th><th>수익률</th><th>원인</th></tr></thead>
      <tbody class="records"></tbody>
    </table>
  </div>
</template>

<div id="result" class="result" hidden>
  <div class="result-card" role="alertdialog" aria-labelledby="resultTitle">
    <img id="resultAnt" class="px result-ant" width="96" height="96" alt="">
    <h2 id="resultTitle"></h2>
    <p id="resultCause"></p>
    <p id="resultRet" class="big"></p>
    <p id="resultLesson" class="lesson"></p>
    <button id="resultRestart" class="primary">다시 시작 <kbd>R</kbd></button>
  </div>
</div>
<div id="fx" class="fx" aria-hidden="true"><div class="fx-box"><img id="fxAnt" class="px" width="128" height="128" alt=""><span id="fxText"></span></div></div>

<script src="pixel.js"></script>
<script src="game.js"></script>
</body>
</html>
